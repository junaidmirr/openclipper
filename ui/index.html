<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenClipper</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Entire pill is draggable -->
    <div id="clipper-hud" class="hud-pill" data-tauri-drag-region>
      <!-- Mode Badge Button & Drag Grip -->
      <div class="hud-left" data-tauri-drag-region>
        <div id="drag-handle" class="drag-grip" title="Drag anywhere on screen" data-tauri-drag-region>
          <span></span><span></span>
        </div>
        <!-- Clickable Mode Switch Button -->
        <button id="mode-btn" class="mode-badge mode-idle" title="Click to cycle mode: Auto ➔ Copy ➔ Paste">
          <span class="mode-dot"></span>
          <span id="mode-label" class="mode-label">AUTO</span>
        </button>
      </div>

      <!-- 9 Mini Slot Buttons -->
      <div class="slots-container" id="slots-container">
        <!-- Rendered by app.js: 9 compact slot items -->
      </div>

      <!-- Actions -->
      <div class="hud-actions">
        <!-- Accessibility Warning Pill (hidden when trusted) -->
        <button id="btn-ax-warn" class="btn-ax-warn hidden" title="Accessibility permission required for shortcuts. Click to enable.">
          ⚠️ Acc
        </button>
        <button id="btn-clear" class="btn-icon" title="Clear all slots">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="Preferences & Settings (Cmd+,)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btn-hide" class="btn-icon" title="Hide to menu bar (Esc)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Live Toast Tooltip -->
    <div id="hud-toast" class="hud-toast"></div>

    <script src="app.js"></script>
  </body>
</html>
