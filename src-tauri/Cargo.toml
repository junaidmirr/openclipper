[package]
name = "openclipper"
version = "0.1.0"
description = "Modal Multi-Copy-Paste Clipboard Manager"
authors = ["OpenClipper Team"]
edition = "2024"

[lib]
name = "openclipper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openclipper-engine = { path = "../engine" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
